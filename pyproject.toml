[project]
name = "swing"
version = "0.1.0"
description = "Free-API swing-trading pipeline: nightly screener, pattern/risk plans, regime check, intraday alerts, Notion briefs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "alpaca-py>=0.30",
    "yfinance>=0.2.50",
    "pandas-market-calendars>=4.4",
    "mplfinance>=0.12.10b0",
    "matplotlib>=3.8",
    "notion-client>=2.2",
    "openai>=1.40",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
extras = [
    "tradingview-screener>=3.0",
    "backtesting>=0.3.3",
]

[project.scripts]
swing = "swing.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swing"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
