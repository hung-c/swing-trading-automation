name: weekly-report

# Fri 17:11 ET ≈ 21:11 UTC (EDT).
on:
  workflow_dispatch:
  schedule:
    - cron: "11 21 * * 5"

concurrency:
  group: swing-weekly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync
      - name: expectancy / SQN report
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run swing report
      - if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: bash .github/scripts/commit_state.sh "report"
