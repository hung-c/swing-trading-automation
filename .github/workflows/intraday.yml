name: intraday

# Every 15 min 10:03-15:48 ET. UTC hours 14-20 cover EDT and EST; session guard is in code.
on:
  workflow_dispatch:
    inputs:
      manage:
        description: "force the management pass"
        type: boolean
        default: false
  schedule:
    - cron: "3,18,33,48 14-20 * * 1-5"

concurrency:
  group: swing-intraday
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync
      - id: guard
        run: echo "run=$(uv run swing should-run intraday)" >> "$GITHUB_OUTPUT"
      - name: alerts (+ manage near the close)
        if: steps.guard.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then ARGS="--force"; fi
          if [ "${{ github.event.inputs.manage }}" = "true" ]; then ARGS="$ARGS --manage"; fi
          uv run swing intraday $ARGS
      - name: commit state
        if: steps.guard.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: bash .github/scripts/commit_state.sh "intraday"
