name: premarket

# 07:03 ET = 11:03 UTC (EDT) / 12:03 UTC (EST). Guard requires hour==7 ET.
on:
  workflow_dispatch:
  schedule:
    - cron: "3 11,12 * * 1-5"

concurrency:
  group: swing-premarket
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  premarket:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync
      - name: require Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: test -n "$DATABASE_URL" || { echo "Set the DATABASE_URL Actions secret (Neon)."; exit 1; }
      - id: guard
        run: echo "run=$(uv run swing should-run premarket)" >> "$GITHUB_OUTPUT"
      - name: premarket regime
        if: steps.guard.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_KEY: ${{ secrets.FRED_KEY }}
        run: |
          FORCE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then FORCE="--force"; fi
          uv run swing premarket $FORCE
