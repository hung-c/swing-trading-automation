name: schedule-test

# Temporary probe: does this private repo get a schedule event every 15 minutes?
# One echo, no checkout. GitHub still bills about 1 Actions minute per run (~96/day).
# Delete this file once the test is done.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: ping
        run: echo "schedule-test $(date -u +%Y-%m-%dT%H:%M:%SZ)"
