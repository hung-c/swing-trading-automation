name: nightly

# 16:37 ET on normal days; 13:37 ET on early-close days (the guard decides which one actually runs).
# Off-:00 minutes reduce GitHub cron drift. `timezone` handles DST.
on:
  schedule:
    - cron: "37 16 * * 1-5"
      timezone: "America/New_York"
    - cron: "37 13 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      limit:
        description: "cap universe size (debug)"
        required: false
        default: ""
      dry_run:
        description: "skip database writes"
        type: boolean
        default: false

concurrency:
  group: swing-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync
      - id: guard
        run: echo "run=$(uv run swing should-run nightly)" >> "$GITHUB_OUTPUT"
      - name: nightly pipeline
        if: steps.guard.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FRED_KEY: ${{ secrets.FRED_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then ARGS="$ARGS --force"; fi
          uv run swing nightly $ARGS
      - name: upload local brief + charts
        if: always() && (steps.guard.outputs.run == 'true' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ github.run_id }}
          path: out/
          retention-days: 14
          if-no-files-found: ignore
      - name: commit state
        if: steps.guard.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: bash .github/scripts/commit_state.sh "nightly"
